name: Test Action
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo to use the action locally
        uses: actions/checkout@v3.5.3

      - name: Run my own container action
        id: my-action
        uses: ./
        with:
          who-to-greet: '@wulfland'

      - name: Output the answer
        run: echo "The answer is ${{ steps.my-action.outputs.answer }}"

      - name: Test the container
        if: ${{ steps.my-action.outputs.answer != 43 }}
        run: |
          echo "::error file=entrypoint.sh,line4,title=Error in container::The answer was not accepted"
          exit 1
